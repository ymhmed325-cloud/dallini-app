services:
  db:
    image: postgres:16-alpine
    container_name: dallini-db
    environment:
      POSTGRES_USER: dallini
      POSTGRES_PASSWORD: dallini
      POSTGRES_DB: dallini
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dallini"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:22-alpine
    container_name: dallini-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install --no-audit --no-fund && node server.js"
    environment:
      PORT: "10000"
      DATABASE_URL: postgres://dallini:dallini@db:5432/dallini
      RESET_DEMO_MODE: "true"
    ports:
      - "10000:10000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
